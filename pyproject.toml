[project]
name = "ultrasound-simulator"
version = "0.1.0"
description = "Ultrasound simulator with BEM and FEM for cross-verification"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "matplotlib"]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: barridos y solves pesados; para el ciclo rápido usar `-m 'not slow'`",
]
