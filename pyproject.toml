[project]
name = "ultrasound-simulator"
version = "0.1.0"
description = "Ultrasound simulator with BEM and FEM for cross-verification"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy", "scipy", "matplotlib", "gmsh"]

# gmsh: mallador de la esfera sumergida (Fase 6b). El mallador propio sólo sabe de cajas
# estructuradas, y armar a mano una malla conforme sobre una superficie curva con dos regiones no
# salió (el split de prismas no es conforme, ver D46).
[project.optional-dependencies]
dev = ["pytest", "sympy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# El dashboard sirve plotly.min.js, app.js, index.html y style.css desde el paquete: sin esto no
# entran en un wheel (en editable funcionan porque se leen del árbol de fuentes).
[tool.setuptools.package-data]
ultrasound_sim = ["dashboard/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "slow: barridos y solves pesados; para el ciclo rápido usar `-m 'not slow'`",
]
